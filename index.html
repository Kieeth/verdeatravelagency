<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verdea Travel Agency</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a href="#home" class="logo">Verdea</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">Menu</button>
    <nav class="site-nav" id="site-nav">
      <a href="#destinations">Destinations</a>
      <a href="#packages">Packages</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Hero -->
    <section id="home" class="hero">
      <div class="container">
        <h1><!-- Main headline --></h1>
        <p><!-- Short tagline --></p>
        <a href="#packages" class="btn">View packages</a>
      </div>
    </section>

    <!-- Destinations -->
    <section id="destinations" class="section">
      <div class="container">
        <h2>Destinations</h2>
        <div class="grid" id="destination-list">
          <!-- Destination cards go here -->
        </div>
      </div>
    </section>

    <!-- Packages -->
    <section id="packages" class="section section-alt">
      <div class="container">
        <h2>Packages</h2>
        <div class="grid" id="package-list">
          <!-- Package cards go here -->
        </div>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="section">
      <div class="container">
        <h2>About us</h2>
        <!-- About content goes here -->
      </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="section section-alt">
      <div class="container">
        <h2>Contact</h2>
        <form id="contact-form" novalidate>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" required></textarea>

          <button type="submit" class="btn">Send message</button>
          <p class="form-status" id="form-status" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Verdea Travel Agency</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
